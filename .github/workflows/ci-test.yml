name: Automated API tests using Postman CLI

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start app with docker-compose
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CDN_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CDN_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CDN_API_SECRET }}
          CLOUDINARY_UPLOAD_FOLDER_NAME: ${{ secrets.CDN_FOLDER_NAME }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MT_SERVER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for app... ($i)"
            sleep 2
          done

      - name: Show app logs if failed to start
        if: failure()
        run: docker compose -f docker-compose.test.yml logs app

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests
        run: |
          postman collection run "29059809-7fb243d7-43e7-4751-8ba5-b14a7cdff34c" \
            -e "29059809-30bdacea-ae83-4817-aea3-890d09e64954" \
            --env-var "host=http://localhost:8000" \
            --insecure-file-read

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.test.yml down